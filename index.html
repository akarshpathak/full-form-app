<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FFA - Full Form App</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
      padding: 20px;
      position: relative;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 20px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      border-radius: 10px;
      border: none;
    }
    button {
      background-color: #00ffff;
      color: #000;
      cursor: pointer;
    }
    #certificate {
      display: none;
      margin-top: 20px;
    }
    canvas {
      max-width: 100%;
      height: auto;
    }
    img {
      max-width: 100%;
    }
    h1.madeby {
      font-size: 24px;
      color: yellow;
      font-weight: bold;
      margin-bottom: 5px;
      text-shadow: 2px 2px 4px #000;
    }
    .footer-icons {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 1000;
    }
    .footer-icons a {
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      font-size: 20px;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 10px;
    }
    .footer-icons img {
      width: 32px;
      height: 32px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="madeby">Made by AKARSH PATHAK</h1>
    <h1>FFA - Full Form App</h1>
    <div id="start">
      <p>Enter your name to begin:</p>
      <input type="text" id="username" placeholder="Your Name" onkeypress="handleEnter(event)" />
      <br />
      <button onclick="startGame()">Start</button>
    </div>

    <div id="game" style="display:none;">
      <h2 id="levelTitle"></h2>
      <p>Coins: <span id="coins">0</span></p>
      <input type="text" id="answer" placeholder="Enter full form here" onkeypress="handleEnterAnswer(event)" />
      <br />
      <button onclick="submitAnswer()">Submit</button>
      <p id="feedback"></p>
    </div>

    <div id="certificate">
      <h2>Congratulations!</h2>
      <p>You have completed all levels.</p>
      <canvas id="certCanvas" width="768" height="768"></canvas>
      <br><br>
      <button onclick="shareToWhatsapp()">Share to Akarsh on WhatsApp</button>
    </div>
  </div>

  <div class="footer-icons">
    <a href="https://www.instagram.com/akar_shpathak/?__pwa=1" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"> AKARSH PATHAK</a>
  </div>

  <script>
    const levels = [
      { abbr: 'CPU', full: 'Central Processing Unit' },
      { abbr: 'RAM', full: 'Random Access Memory' },
      { abbr: 'HDD', full: 'Hard Disk Drive' },
      { abbr: 'SSD', full: 'Solid State Drive' },
      { abbr: 'GPU', full: 'Graphics Processing Unit' },
      { abbr: 'BIOS', full: 'Basic Input/Output System' },
      { abbr: 'LCD', full: 'Liquid Crystal Display' },
      { abbr: 'OS', full: 'Operating System' },
      { abbr: 'PC', full: 'Personal Computer' },
      { abbr: 'ALU', full: 'Arithmetic Logic Unit' },
      { abbr: 'PDF', full: 'Portable Document Format' },
      { abbr: 'LED', full: 'Light Emitting Diode' },
      { abbr: 'LAN', full: 'Local Area Network' },
      { abbr: 'IP', full: 'Internet Protocol' },

    ];

    let currentLevel = 0;
    let coins = 0;
    let username = '';

    function startGame() {
      username = document.getElementById('username').value;
      if (!username) return alert('Please enter your name');
      document.getElementById('start').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      loadLevel();
    }

    function loadLevel() {
      if (currentLevel >= levels.length) {
        showCertificate();
        return;
      }
      document.getElementById('answer').value = '';
      document.getElementById('feedback').textContent = '';
      document.getElementById('levelTitle').textContent = `Level ${currentLevel + 1}: ${levels[currentLevel].abbr}`;
    }

    function submitAnswer() {
      const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
      const correct = levels[currentLevel].full.toLowerCase();
      if (userAnswer === correct) {
        coins += 3;
        document.getElementById('coins').textContent = coins;
        document.getElementById('feedback').textContent = 'Correct! +3 coins';
        currentLevel++;
        setTimeout(loadLevel, 1000);
      } else {
        document.getElementById('feedback').textContent = 'Wrong! Try again.';
      }
    }

    function handleEnter(event) {
      if (event.key === 'Enter') {
        startGame();
      }
    }

    function handleEnterAnswer(event) {
      if (event.key === 'Enter') {
        submitAnswer();
      }
    }

    function showCertificate() {
      document.getElementById('game').style.display = 'none';
      document.getElementById('certificate').style.display = 'block';

      const canvas = document.getElementById('certCanvas');
      const ctx = canvas.getContext('2d');

      const certImg = new Image();
      certImg.crossOrigin = 'anonymous';
      certImg.src = 'https://i.imgur.com/ZhRAtCC.png';

      certImg.onload = function () {
        ctx.drawImage(certImg, 0, 0, canvas.width, canvas.height);

        ctx.font = '30px Arial';
        ctx.fillStyle = '#00ffff';
        ctx.textAlign = 'center';
        ctx.fillText(username, canvas.width / 2, 380);

        ctx.textAlign = 'left';
        ctx.fillText(new Date().toLocaleDateString(), 160, 550);
      };
    }

    function shareToWhatsapp() {
      const canvas = document.getElementById('certCanvas');
      const imageData = canvas.toDataURL('image/png');

      fetch('https://api.imgur.com/3/image', {
        method: 'POST',
        headers: {
          Authorization: 'Client-ID 0a11c2c740aeb82',
        },
        body: new URLSearchParams({
          image: imageData.split(',')[1],
          type: 'base64',
        })
      })
        .then(response => response.json())
        .then(data => {
          const imageUrl = data.data.link;
          const message = encodeURIComponent(`Hey Akarsh, this is my certificate!
${imageUrl}`);
          const whatsappUrl = `https://wa.me/919771108353?text=${message}`;
          window.open(whatsappUrl, '_blank');
        })
        .catch(err => alert("Failed to upload certificate image."));
    }
  </script>
</body>
</html>
